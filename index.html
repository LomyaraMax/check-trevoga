<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Запрет кэширования для браузеров -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Отчет по закрытию отделений</title>
  <style>
    /* ==========================================
       ПЕРЕМЕННЫЕ ТЕМ ОФОРМЛЕНИЯ
       ========================================== */
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --header-bg: linear-gradient(135deg, #0f172a, #1e293b);
      --header-border: #334155;
      --card-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-border: #334155;
      --card-hover-border: #475569;
      --card-closed-bg: linear-gradient(135deg, #064e3b, #0f172a);
      --card-closed-border: rgba(34, 197, 94, 0.4);
      --input-bg: #1e293b;
      --input-border: #334155;
      --input-text: #f8fafc;
      --status-btn-bg: rgba(51, 65, 85, 0.6);
      --status-btn-text: #94a3b8;
      --status-btn-border: #334155;
      --status-btn-active-bg: linear-gradient(135deg, #22c55e, #16a34a);
      --status-btn-active-text: #ffffff;
      --status-btn-active-shadow: 0 0 14px rgba(34, 197, 94, 0.4);
      --modal-bg: #0f172a;
      --modal-border: #334155;
      --modal-overlay: rgba(15, 23, 42, 0.8);
      --badge-bg: #0f172a;
      --badge-border: #334155;
      --theme-btn-bg: #1e293b;
      --theme-btn-border: #334155;
      --theme-btn-color: #fbbf24;
      --chat-msg-other-bg: #1e293b;
      --chat-msg-other-border: rgba(255, 255, 255, 0.08);
      --chat-msg-text: #f8fafc;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --header-bg: #ffffff;
      --header-border: #e2e8f0;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover-border: #cbd5e1;
      --card-closed-bg: #f0fdf4;
      --card-closed-border: #86efac;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-text: #0f172a;
      
      /* Светлый неактивный тачик */
      --status-btn-bg: #f1f5f9;
      --status-btn-text: #64748b;
      --status-btn-border: #cbd5e1;
      
      /* Сочный активный тачик */
      --status-btn-active-bg: linear-gradient(135deg, #4ade80, #22c55e);
      --status-btn-active-text: #ffffff;
      --status-btn-active-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
      
      --modal-bg: #ffffff;
      --modal-border: #e2e8f0;
      --modal-overlay: rgba(15, 23, 42, 0.3);
      --badge-bg: #ffffff;
      --badge-border: #e2e8f0;
      --theme-btn-bg: #f1f5f9;
      --theme-btn-border: #cbd5e1;
      --theme-btn-color: #4f46e5;
      --chat-msg-other-bg: #f1f5f9;
      --chat-msg-other-border: #e2e8f0;
      --chat-msg-text: #0f172a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.modal-open {
      overflow: hidden !important;
      touch-action: none;
    }

    .header {
      background: var(--header-bg);
      border: 1px solid var(--header-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      position: sticky;
      top: 0;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .title {
      font-size: 0,9rem;
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .theme-toggle-btn {
      background: var(--theme-btn-bg);
      border: 1px solid var(--theme-btn-border);
      color: var(--theme-btn-color);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .theme-toggle-btn:hover {
      transform: scale(1.08);
    }

    .chat-trigger-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }

    .chat-trigger-btn:hover {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      transform: scale(1.08);
    }

    .chat-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background-color: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 2px 6px;
      display: none;
      border: 2px solid var(--modal-bg);
    }

    .counter {
      background: rgba(56, 189, 248, 0.12);
      color: #0284c7;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    [data-theme="dark"] .counter {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.3);
    }

    .counter:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 12px 40px 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.3s ease;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .grid {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-1px);
    }

    .card.is-closed {
      border-color: var(--card-closed-border);
      background: var(--card-closed-bg);
    }

    .branch-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-color);
      letter-spacing: 0.3px;
    }

    /* ==========================================
       СТИЛИ ТАЧИКА / КНОПКИ СТАТУСА
       ========================================== */
    .status-btn {
      background-color: var(--status-btn-bg);
      color: var(--status-btn-text);
      border: 1px solid var(--status-btn-border);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      min-width: 115px;
      text-align: center;
      touch-action: manipulation;
    }

    .status-btn:hover {
      filter: brightness(0.95);
    }

    .status-btn.active {
      background: var(--status-btn-active-bg);
      color: var(--status-btn-active-text);
      border-color: #22c55e;
      font-weight: 700;
      box-shadow: var(--status-btn-active-shadow);
    }

    .status-btn.active:hover {
      filter: brightness(1.05);
      transform: scale(1.02);
    }

    .no-results {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.95rem;
    }

    .footer {
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-top: auto;
      bottom: 5px;
      padding-bottom: 5px;
      position: sticky;
      padding-top: 10px;
    }

    .reset-btn {
      background-color: var(--bg-color);
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .reset-btn:active {
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* Модальные окна */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
      overscroll-behavior: contain;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      border: 1px solid var(--modal-border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      background-color: var(--modal-bg);
      color: var(--text-color);
    }

    .modal-header {
      padding: 12px 16px;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--modal-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header-title {
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .modal-close-btn:hover {
      color: var(--text-color);
    }

    .pending-body {
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .pending-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 10px;
    }

    .pending-badge {
      background-color: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: #0284c7;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 12px 8px;
      border-radius: 10px;
      text-align: center;
      transition: all 0.3s ease;
      opacity: 1;
      transform: scale(1);
    }

    [data-theme="dark"] .pending-badge {
      color: #38bdf8;
    }

    .pending-badge.fade-out {
      opacity: 0;
      transform: scale(0.7);
    }

    .pending-empty {
      text-align: center;
      color: #22c55e;
      font-weight: 600;
      padding: 30px 10px;
      font-size: 1.1rem;
    }

    /* ==========================================
       СТИЛИ ЧАТА (АДАПТИВНЫ ПОД ТЕМУ)
       ========================================== */
    .chat-modal {
      height: 85vh;
      max-height: 650px;
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
      color: var(--text-color);
    }

    .chat-modal .modal-header {
      background: var(--header-bg);
      border-bottom: 1px solid var(--modal-border);
      padding: 14px 18px;
      color: var(--text-color);
    }

    .chat-messages::-webkit-scrollbar,
    .sticker-picker::-webkit-scrollbar {
      width: 5px;
    }
    .chat-messages::-webkit-scrollbar-track,
    .sticker-picker::-webkit-scrollbar-track {
      background: transparent;
    }
    .chat-messages::-webkit-scrollbar-thumb,
    .sticker-picker::-webkit-scrollbar-thumb {
      background: var(--status-btn-border);
      border-radius: 10px;
    }

    .chat-messages {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-color);
      overscroll-behavior: contain;
    }

    .chat-message {
      position: relative;
      background: var(--chat-msg-other-bg);
      border: 1px solid var(--chat-msg-other-border);
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      max-width: 80%;
      word-wrap: break-word;
      align-self: flex-start;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      animation: msgPop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chat-message.my-message {
      align-self: flex-end;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      border: none;
      border-radius: 16px 16px 4px 16px;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.25);
    }

    @keyframes msgPop {
      from { opacity: 0; transform: translateY(8px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .message-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      font-size: 0.72rem;
      margin-bottom: 4px;
    }

    .message-sender {
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    .chat-message.my-message .message-sender {
      color: #e0f2fe !important;
    }

    .message-time {
      color: var(--status-btn-text);
      font-size: 0.68rem;
    }

    .chat-message.my-message .message-time {
      color: rgba(255, 255, 255, 0.8);
    }

    .message-text {
      font-size: 0.95rem;
      line-height: 1.4;
      color: var(--chat-msg-text);
    }

    .chat-message.my-message .message-text {
      color: #ffffff;
    }

    .chat-input-area {
      padding: 10px 14px;
      background: var(--header-bg);
      border-top: 1px solid var(--modal-border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sticker-toggle-btn {
      background: var(--status-btn-bg);
      border: 1px solid var(--status-btn-border);
      font-size: 1.2rem;
      cursor: pointer;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sticker-toggle-btn:hover {
      transform: scale(1.05);
    }

    .chat-input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      width: 80%;
    }

    .chat-input:focus {
      border-color: #38bdf8;
    }

    .chat-send-btn {
      width: 42px;
      height: 40px;
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    .chat-send-btn:hover {
      transform: scale(1.05);
    }

    .sticker-picker {
      background: var(--modal-bg);
      border-top: 1px solid var(--modal-border);
      padding: 12px 14px;
      display: none;
      flex-direction: column;
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      overscroll-behavior: contain;
    }

    .sticker-picker.active {
      display: flex;
    }

    .sticker-picker-title {
      font-size: 0.72rem;
      color: var(--status-btn-text);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .sticker-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
    }

    .sticker-item {
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 8px;
      background: var(--status-btn-bg);
      border: 1px solid var(--status-btn-border);
      border-radius: 12px;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .sticker-item:hover {
      transform: translateY(-3px) scale(1.15);
      border-color: #38bdf8;
    }

    .sticker-item img {
      width: 40px;
      height: 40px;
      object-fit: contain;
    }

    .chat-message.is-sticker {
      background: transparent !important;
      border: none !important;
      padding: 4px !important;
      box-shadow: none !important;
    }

    .chat-message.is-sticker .message-body {
      margin-top: 6px;
    }

    .chat-message.is-sticker img.tg-sticker-img {
      width: 110px;
      height: 110px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.2));
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .chat-message.is-sticker img.tg-sticker-img:hover {
      transform: scale(1.1) rotate(2deg);
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="header">
    <div class="title">Контроль закрытия</div>
    <div class="header-controls">
      <!-- Переключатель темы -->
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Сменить тему">
        <svg id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="chat-trigger-btn" id="openChatBtn" onclick="openChat()" title="Открыть анонимный чат">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="chat-badge" id="chatBadge">0</span>
      </button>
      <div class="counter" id="counter" onclick="openPendingModal()" title="Нажмите, чтобы увидеть незакрытые">0 / 20</div>
    </div>
  </div>

  <div class="search-container">
    <input 
      type="number" 
      id="searchInput" 
      class="search-input" 
      placeholder="Введите № отделения..."
    >
    <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>

  <div class="grid" id="branchesGrid"></div>

  <div class="footer">
    <button class="reset-btn" id="resetBtn" onclick="resetAll()">Сбросить всё пароль (00) [00:30]</button>
  </div>

  <!-- Модалка чата -->
  <div class="modal-overlay" id="chatModalOverlay" onclick="handleOverlayClick(event, 'chat')">
    <div class="modal-card chat-modal">
      <div class="modal-header">
        <div class="modal-header-title">
          <span>💬 Анонимный чат</span>
        </div>
        <button class="modal-close-btn" onclick="closeChat()">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>

      <div class="sticker-picker" id="stickerPicker">
        <div class="sticker-picker-title">Стикеры</div>
        <div class="sticker-grid" id="stickerGrid"></div>
      </div>

      <form class="chat-input-area" onsubmit="sendMessage(event)">
        <button type="button" class="sticker-toggle-btn" onclick="toggleStickerPicker()" title="Выбрать стикер">🤡</button>
        <input type="text" id="chatInput" class="chat-input" placeholder="Напишите сообщение..." maxlength="300" autocomplete="off">
        <button type="submit" class="chat-send-btn" title="Отправить">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Модалка списка остатка -->
  <div class="modal-overlay" id="pendingModalOverlay" onclick="handleOverlayClick(event, 'pending')">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-header-title">
          <span>⏳ Осталось закрыть</span>
        </div>
        <button class="modal-close-btn" onclick="closePendingModal()">✕</button>
      </div>
      <div class="pending-body">
        <div class="pending-grid" id="pendingGrid"></div>
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // ЛОГИКА ТЕМЫ
    // ==========================================
    const STORAGE_KEY_THEME = 'app_theme';
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(STORAGE_KEY_THEME, theme);
      if (theme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      applyTheme(newTheme);
    }

    const savedTheme = localStorage.getItem(STORAGE_KEY_THEME) || 'dark';
    applyTheme(savedTheme);

    // ==========================================
    // ЛОГИКА ПРИЛОЖЕНИЯ
    // ==========================================
    const BRANCH_NUMBERS = [
      51, 37, 57, 7, 124, 148, 88, 127, 119, 68, 
      163, 76, 95, 98, 96, 122, 50, 53, 17, 110
    ];

    const INITIAL_STATUSES = {
      "51": false, "37": false, "57": false, "7": false, "124": false,
      "148": false, "88": false, "127": false, "119": false, "68": false,
      "163": false, "76": false, "95": false, "98": false, "96": false,
      "122": false, "50": false, "53": false, "17": false, "110": false
    };

    const TIMEOUT_MS = 12 * 60 * 1000; 

    const TELEGRAM_STICKERS = [
      "https://em-content.zobj.net/source/telegram/386/clown-face_1f921.webp",
      "https://em-content.zobj.net/source/telegram/386/cat-with-tears-of-joy_1f639.webp",
      "https://em-content.zobj.net/source/telegram/386/crying-cat_1f63f.webp",
      "https://em-content.zobj.net/source/telegram/386/pouting-cat_1f63e.webp",
      "https://em-content.zobj.net/source/telegram/386/screaming-cat_1f640.webp",
      "https://em-content.zobj.net/source/telegram/386/grinning-cat-with-smiling-eyes_1f638.webp",
      "https://em-content.zobj.net/source/telegram/386/smiling-cat-with-heart-eyes_1f63b.webp",
      "https://em-content.zobj.net/source/telegram/386/cat-with-wry-smile_1f63c.webp",
      "https://em-content.zobj.net/source/telegram/386/face-with-tears-of-joy_1f602.webp",
      "https://em-content.zobj.net/source/telegram/386/rolling-on-the-floor-laughing_1f923.webp",
      "https://em-content.zobj.net/source/telegram/386/exploding-head_1f92f.webp",
      "https://em-content.zobj.net/source/telegram/386/melting-face_1e9e0.webp",
      "https://em-content.zobj.net/source/telegram/386/saluting-face_1e9e1.webp",
      "https://em-content.zobj.net/source/telegram/386/face-with-peeking-eye_1e9e3.webp",
      "https://em-content.zobj.net/source/telegram/386/thinking-face_1f914.webp",
      "https://em-content.zobj.net/source/telegram/386/shushing-face_1f92b.webp",
      "https://em-content.zobj.net/source/telegram/386/face-with-monocle_1f9d0.webp",
      "https://em-content.zobj.net/source/telegram/386/nerd-face_1f913.webp",
      "https://em-content.zobj.net/source/telegram/386/woozy-face_1f974.webp",
      "https://em-content.zobj.net/source/telegram/386/partying-face_1f973.webp",
      "https://em-content.zobj.net/source/telegram/386/face-holding-back-tears_1e9e9.webp",
      "https://em-content.zobj.net/source/telegram/386/face-screaming-in-fear_1f631.webp",
      "https://em-content.zobj.net/source/telegram/386/flushed-face_1f633.webp",
      "https://em-content.zobj.net/source/telegram/386/thumbs-up_1f44d.webp",
      "https://em-content.zobj.net/source/telegram/386/facepalm_1f926.webp",
      "https://em-content.zobj.net/source/telegram/386/pinched-fingers_1f90c.webp",
      "https://em-content.zobj.net/source/telegram/386/ok-hand_1f44c.webp",
      "https://em-content.zobj.net/source/telegram/386/victory-hand_270c-fe0f.webp",
      "https://em-content.zobj.net/source/telegram/386/middle-finger_1f595.webp",
      "https://em-content.zobj.net/source/telegram/386/clapping-hands_1f44f.webp",
      "https://em-content.zobj.net/source/telegram/386/folded-hands_1f64f.webp",
      "https://em-content.zobj.net/source/telegram/386/fire_1f525.webp",
      "https://em-content.zobj.net/source/telegram/386/package_1f4e6.webp",
      "https://em-content.zobj.net/source/telegram/386/delivery-truck_1f69a.webp",
      "https://em-content.zobj.net/source/telegram/386/rocket_1f680.webp",
      "https://em-content.zobj.net/source/telegram/386/pile-of-poo_1f4a9.webp",
      "https://em-content.zobj.net/source/telegram/386/party-popper_1f389.webp",
      "https://em-content.zobj.net/source/telegram/386/check-mark-button_2705.webp",
      "https://em-content.zobj.net/source/telegram/386/cross-mark_274c.webp",
      "https://em-content.zobj.net/source/telegram/386/ghost_1f47b.webp"
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyArdBRpk8EyzBJ_Uruk2rYGzlzdS-Eaj50",
      authDomain: "mid-np-470dc.firebaseapp.com",
      databaseURL: "https://mid-np-470dc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mid-np-470dc",
      storageBucket: "mid-np-470dc.firebasestorage.app",
      messagingSenderId: "1051368843938",
      appId: "1:1051368843938:web:bf019281005027580345fb",
      measurementId: "G-YERGDJ4FXT"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const branchesRef = db.ref('branches_map_v3');
    const lastActivityRef = db.ref('last_activity_v3');
    const chatRef = db.ref('chat_messages_v1');

    let serverTimeOffset = 0;
    db.ref('.info/serverTimeOffset').on('value', (snap) => {
      serverTimeOffset = snap.val() || 0;
    });

    const STORAGE_KEY_FILTER = 'branches_filter_app';
    const STORAGE_KEY_USER_ID = 'chat_user_id';
    const STORAGE_KEY_USER_COLOR = 'chat_user_color';

    let myUserId = localStorage.getItem(STORAGE_KEY_USER_ID);
    if (!myUserId) {
      myUserId = 'Аноним #' + Math.floor(100 + Math.random() * 900);
      localStorage.setItem(STORAGE_KEY_USER_ID, myUserId);
    }

    let myUserColor = localStorage.getItem(STORAGE_KEY_USER_COLOR);
    if (!myUserColor) {
      const colors = ['#38bdf8', '#4ade80', '#f43f5e', '#fbbf24', '#c084fc', '#f97316'];
      myUserColor = colors[Math.floor(Math.random() * colors.length)];
      localStorage.setItem(STORAGE_KEY_USER_COLOR, myUserColor);
    }

    let branchStatus = { ...INITIAL_STATUSES };
    let lastActivityTimestamp = null;
    let savedFilter = localStorage.getItem(STORAGE_KEY_FILTER) || '';
    let wasExpiredState = false;

    let audioCtx = null;
    let hasPlayedSoundThisCycle = false;

    let isChatOpen = false;
    let unreadCount = 0;
    let isInitialChatLoad = true;
    let isPendingModalOpen = false;

    const gridEl = document.getElementById('branchesGrid');
    const counterEl = document.getElementById('counter');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    const chatModalOverlay = document.getElementById('chatModalOverlay');
    const chatMessagesEl = document.getElementById('chatMessages');
    const chatInputEl = document.getElementById('chatInput');
    const chatBadgeEl = document.getElementById('chatBadge');
    const stickerPickerEl = document.getElementById('stickerPicker');
    const stickerGridEl = document.getElementById('stickerGrid');

    const pendingModalOverlay = document.getElementById('pendingModalOverlay');
    const pendingGridEl = document.getElementById('pendingGrid');

    function initStickers() {
      if (!stickerGridEl) return;
      stickerGridEl.innerHTML = '';
      TELEGRAM_STICKERS.forEach((url) => {
        const item = document.createElement('div');
        item.className = 'sticker-item';
        
        const img = document.createElement('img');
        img.src = url;
        img.loading = 'lazy';
        img.onerror = () => { item.style.display = 'none'; };

        item.appendChild(img);
        item.onclick = () => sendSticker(url);
        stickerGridEl.appendChild(item);
      });
    }
    initStickers();

    function toggleStickerPicker() {
      stickerPickerEl.classList.toggle('active');
    }

    function sendSticker(stickerUrl) {
      const newMsg = {
        stickerUrl: stickerUrl,
        isSticker: true,
        senderId: myUserId,
        color: myUserColor,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      chatRef.push(newMsg);
      stickerPickerEl.classList.remove('active');
    }

    document.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: false });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (isChatOpen) closeChat();
        if (isPendingModalOpen) closePendingModal();
      }
    });

    function playSuccessSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.15);
        gain2.gain.setValueAtTime(0.4, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.6);
      } catch (e) {
        console.log("Ошибка звука:", e);
      }
    }

    searchInput.value = savedFilter;

    lastActivityRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        lastActivityTimestamp = val;
        updateTimerAndState();
      }
    });

    branchesRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        branchesRef.set(INITIAL_STATUSES);
        lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
      } else {
        branchStatus = data;
        renderGrid();
        renderPendingGrid();
        updateTimerAndState();
      }
    }, (error) => {
      console.error("Ошибка чтения Firebase:", error);
      gridEl.innerHTML = '<div class="no-results">Ошибка подключения к базе данных!</div>';
    });

    chatRef.limitToLast(50).on('value', (snapshot) => {
      const data = snapshot.val();
      chatMessagesEl.innerHTML = '';

      if (data) {
        const messages = Object.values(data);
        messages.forEach(msg => {
          renderChatMessage(msg);
        });

        if (isInitialChatLoad) {
          isInitialChatLoad = false;
        } else if (!isChatOpen) {
          unreadCount++;
          updateBadge();
        }

        if (isChatOpen) {
          scrollChatToBottom();
        }
      } else {
        chatMessagesEl.innerHTML = '<div class="no-results">Сообщений пока нет...</div>';
      }
    });

    function renderChatMessage(msg) {
      const isMine = msg.senderId === myUserId;
      const msgDiv = document.createElement('div');
      
      if (msg.isSticker) {
        msgDiv.className = `chat-message is-sticker ${isMine ? 'my-message' : ''}`;
      } else {
        msgDiv.className = `chat-message ${isMine ? 'my-message' : ''}`;
      }

      const metaDiv = document.createElement('div');
      metaDiv.className = 'message-meta';

      const senderSpan = document.createElement('span');
      senderSpan.className = 'message-sender';
      senderSpan.textContent = isMine ? 'Вы' : msg.senderId;
      senderSpan.style.color = isMine ? '#93c5fd' : (msg.color || '#38bdf8');

      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      
      const date = new Date(msg.timestamp);
      const hours = String(date.getHours()).padStart(2, '0');
      const mins = String(date.getMinutes()).padStart(2, '0');
      timeSpan.textContent = `${hours}:${mins}`;

      metaDiv.appendChild(senderSpan);
      metaDiv.appendChild(timeSpan);

      const bodyDiv = document.createElement('div');

      if (msg.isSticker) {
        bodyDiv.className = 'message-body';
        const img = document.createElement('img');
        img.className = 'tg-sticker-img';
        img.src = msg.stickerUrl;
        img.alt = 'Sticker';
        bodyDiv.appendChild(img);
      } else {
        bodyDiv.className = 'message-text';
        bodyDiv.textContent = msg.text;
      }

      msgDiv.appendChild(metaDiv);
      msgDiv.appendChild(bodyDiv);
      chatMessagesEl.appendChild(msgDiv);
    }

    function sendMessage(e) {
      e.preventDefault();
      const text = chatInputEl.value.trim();
      if (!text) return;

      const newMsg = {
        text: text,
        senderId: myUserId,
        color: myUserColor,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      chatRef.push(newMsg);
      chatInputEl.value = '';
    }

    function openChat() {
      isChatOpen = true;
      document.body.classList.add('modal-open');
      chatModalOverlay.classList.add('active');
      unreadCount = 0;
      updateBadge();
      scrollChatToBottom();
      setTimeout(() => chatInputEl.focus(), 100);
    }

    function closeChat() {
      isChatOpen = false;
      document.body.classList.remove('modal-open');
      chatModalOverlay.classList.remove('active');
      stickerPickerEl.classList.remove('active');
    }

    function openPendingModal() {
      isPendingModalOpen = true;
      document.body.classList.add('modal-open');
      renderPendingGrid(true);
      pendingModalOverlay.classList.add('active');
    }

    function closePendingModal() {
      isPendingModalOpen = false;
      document.body.classList.remove('modal-open');
      pendingModalOverlay.classList.remove('active');
    }

    function handleOverlayClick(e, type) {
      if (type === 'chat' && e.target === chatModalOverlay) closeChat();
      if (type === 'pending' && e.target === pendingModalOverlay) closePendingModal();
    }

    function updateBadge() {
      if (unreadCount > 0) {
        chatBadgeEl.textContent = unreadCount > 99 ? '99+' : unreadCount;
        chatBadgeEl.style.display = 'block';
      } else {
        chatBadgeEl.style.display = 'none';
      }
    }

    function scrollChatToBottom() {
      setTimeout(() => {
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      }, 50);
    }

    function updateTimerAndState() {
      if (!lastActivityTimestamp) return;

      const currentServerTime = Date.now() + serverTimeOffset;
      const elapsed = currentServerTime - lastActivityTimestamp;
      const remaining = TIMEOUT_MS - elapsed;

      if (remaining <= 0) {
        resetBtn.textContent = "Сбросить всё пароль (00) [00:00]";
        
        if (!wasExpiredState) {
          wasExpiredState = true;
          renderGrid();
          renderPendingGrid();
        }
      } else {
        if (wasExpiredState) {
          wasExpiredState = false;
          renderGrid();
          renderPendingGrid();
        }
        
        const totalSeconds = Math.floor(remaining / 1000);
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        resetBtn.textContent = `Сбросить всё пароль (00) [${timeStr}]`;
      }
    }

    setInterval(updateTimerAndState, 1000);

    function renderGrid() {
      gridEl.innerHTML = '';
      let closedCount = 0;
      const filterValue = searchInput.value.trim();

      clearSearchBtn.style.display = filterValue ? 'block' : 'none';
      let renderedCardsCount = 0;

      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      BRANCH_NUMBERS.forEach((branchNum) => {
        const numStr = branchNum.toString();
        
        const rawStatus = !!branchStatus[numStr];
        const isClosed = isExpired ? false : rawStatus;
        
        if (isClosed) closedCount++;

        if (filterValue !== '' && numStr !== filterValue) {
          return;
        }

        renderedCardsCount++;

        const card = document.createElement('div');
        card.className = `card ${isClosed ? 'is-closed' : ''}`;

        const name = document.createElement('span');
        name.className = 'branch-name';
        name.textContent = `Отделение №${numStr}`;

        const btn = document.createElement('button');
        btn.className = `status-btn ${isClosed ? 'active' : ''}`;
        btn.textContent = isClosed ? 'ЗАКРЫТО' : 'Не закрыто';
        btn.onclick = () => toggleBranch(numStr);

        card.appendChild(name);
        card.appendChild(btn);
        gridEl.appendChild(card);
      });

      if (renderedCardsCount === 0) {
        gridEl.innerHTML = '<div class="no-results">Отделение не найдено</div>';
      }

      if (closedCount === BRANCH_NUMBERS.length && !isExpired) {
        if (!hasPlayedSoundThisCycle) {
          playSuccessSound();
          hasPlayedSoundThisCycle = true;
        }
      } else {
        hasPlayedSoundThisCycle = false;
      }

      counterEl.textContent = `${closedCount} / ${BRANCH_NUMBERS.length}`;
    }

    function renderPendingGrid(forceFullRebuild = false) {
      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      const pendingNumbers = BRANCH_NUMBERS.filter(num => {
        const isClosed = isExpired ? false : !!branchStatus[num.toString()];
        return !isClosed;
      });

      if (pendingNumbers.length === 0) {
        pendingGridEl.innerHTML = '<div class="pending-empty">🎉 Все отделения успешно закрыты!</div>';
        return;
      }

      if (forceFullRebuild || pendingGridEl.querySelector('.pending-empty')) {
        pendingGridEl.innerHTML = '';
        pendingNumbers.forEach(num => {
          const badge = document.createElement('div');
          badge.className = 'pending-badge';
          badge.dataset.num = num;
          badge.textContent = `№${num}`;
          pendingGridEl.appendChild(badge);
        });
      } else {
        const existingBadges = pendingGridEl.querySelectorAll('.pending-badge');
        existingBadges.forEach(badge => {
          const num = parseInt(badge.dataset.num, 10);
          if (!pendingNumbers.includes(num) && !badge.classList.contains('fade-out')) {
            badge.classList.add('fade-out');
            setTimeout(() => {
              badge.remove();
              if (pendingGridEl.children.length === 0) {
                pendingGridEl.innerHTML = '<div class="pending-empty">🎉 Все отделения успешно закрыты!</div>';
              }
            }, 300);
          }
        });

        pendingNumbers.forEach(num => {
          let badge = pendingGridEl.querySelector(`[data-num="${num}"]`);
          if (!badge) {
            badge = document.createElement('div');
            badge.className = 'pending-badge';
            badge.dataset.num = num;
            badge.textContent = `№${num}`;
            pendingGridEl.appendChild(badge);
          }
        });
      }
    }

    function toggleBranch(branchNumStr) {
      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      if (isExpired) {
        const newMap = {};
        BRANCH_NUMBERS.forEach(num => newMap[num.toString()] = false);
        newMap[branchNumStr] = true;

        branchesRef.set(newMap);
      } else {
        const newStatus = !branchStatus[branchNumStr];
        db.ref(`branches_map_v3/${branchNumStr}`).set(newStatus);
      }

      lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
    }

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      localStorage.setItem(STORAGE_KEY_FILTER, val);
      renderGrid();
    });

    function clearSearch() {
      searchInput.value = '';
      localStorage.removeItem(STORAGE_KEY_FILTER);
      renderGrid();
    }

    function resetAll() {
      const pass = prompt('Введите пароль для сброса:');
      if (pass === '00') {
        const resetState = {};
        BRANCH_NUMBERS.forEach(num => resetState[num] = false);
        branchesRef.set(resetState);
        lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
      } else if (pass !== null) {
        alert('Неверный пароль!');
      }
    }
  </script>
