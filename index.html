<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Отчет по закрытию отделений</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      width: 100%;
      max-width: 500px;
      position: sticky;
      top: 0;
      background-color: #1e293b;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .counter {
      background-color: #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #38bdf8;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 40px 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .grid {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .card.is-closed {
      border-color: #22c55e;
    }

    .branch-name {
      font-weight: 500;
      font-size: 1rem;
    }

    .status-btn {
      background-color: #334155;
      color: #94a3b8;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      min-width: 110px;
    }

    .status-btn.active {
      background-color: #22c55e;
      color: #052e16;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }

    .no-results {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.95rem;
    }

    .footer {
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-top: auto;
      padding-bottom: 20px;
    }

    .reset-btn {
      background-color: transparent;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .reset-btn:active {
      background-color: rgba(239, 68, 68, 0.1);
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="header">
    <div class="title">Контроль закрытия</div>
    <div class="counter" id="counter">0 / 20</div>
  </div>

  <div class="search-container">
    <input 
      type="number" 
      id="searchInput" 
      class="search-input" 
      placeholder="Введите № отделения (напр. 7)..."
      min="1"
      max="20"
    >
    <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>

  <div class="grid" id="branchesGrid"></div>

  <div class="footer">
    <button class="reset-btn" onclick="resetAll()">Сбросить всё</button>
  </div>

  <script>
    // Ваши настройки Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyArdBRpk8EyzBJ_Uruk2rYGzlzdS-Eaj50",
      authDomain: "mid-np-470dc.firebaseapp.com",
      databaseURL: "https://mid-np-470dc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mid-np-470dc",
      storageBucket: "mid-np-470dc.firebasestorage.app",
      messagingSenderId: "1051368843938",
      appId: "1:1051368843938:web:bf019281005027580345fb",
      measurementId: "G-YERGDJ4FXT"
    };

    // Инициализируем Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const branchesRef = db.ref('branches');

    const TOTAL_BRANCHES = 20;
    const STORAGE_KEY_FILTER = 'branches_filter_app';

    let branchStatus = new Array(TOTAL_BRANCHES).fill(false);
    let savedFilter = localStorage.getItem(STORAGE_KEY_FILTER) || '';

    const gridEl = document.getElementById('branchesGrid');
    const counterEl = document.getElementById('counter');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');

    searchInput.value = savedFilter;

    // Подписка на изменения в базе данных в реальном времени
    branchesRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (data) {
        branchStatus = data;
      } else {
        branchStatus = new Array(TOTAL_BRANCHES).fill(false);
        branchesRef.set(branchStatus);
      }
      renderGrid();
    });

    function renderGrid() {
      gridEl.innerHTML = '';
      let closedCount = 0;
      const filterValue = searchInput.value.trim();

      clearSearchBtn.style.display = filterValue ? 'block' : 'none';
      let renderedCardsCount = 0;

      for (let i = 0; i < TOTAL_BRANCHES; i++) {
        const branchNum = i + 1;
        const isClosed = branchStatus[i] || false;
        if (isClosed) closedCount++;

        if (filterValue !== '' && branchNum.toString() !== filterValue) {
          continue; 
        }

        renderedCardsCount++;

        const card = document.createElement('div');
        card.className = `card ${isClosed ? 'is-closed' : ''}`;

        const name = document.createElement('span');
        name.className = 'branch-name';
        name.textContent = `Отделение №${branchNum}`;

        const btn = document.createElement('button');
        btn.className = `status-btn ${isClosed ? 'active' : ''}`;
        btn.textContent = isClosed ? 'ЗАКРЫТО' : 'Не закрыто';
        btn.onclick = () => toggleBranch(i);

        card.appendChild(name);
        card.appendChild(btn);
        gridEl.appendChild(card);
      }

      if (renderedCardsCount === 0) {
        gridEl.innerHTML = '<div class="no-results">Отделение не найдено</div>';
      }

      counterEl.textContent = `${closedCount} / ${TOTAL_BRANCHES}`;
    }

    function toggleBranch(index) {
      // Обновляем статус отделения в облаке
      db.ref(`branches/${index}`).set(!branchStatus[index]);
    }

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      localStorage.setItem(STORAGE_KEY_FILTER, val);
      renderGrid();
    });

    function clearSearch() {
      searchInput.value = '';
      localStorage.removeItem(STORAGE_KEY_FILTER);
      renderGrid();
    }

    function resetAll() {
      const pass = prompt('Введите пароль для сброса:');
      if (pass === '00') {
        const emptyState = new Array(TOTAL_BRANCHES).fill(false);
        branchesRef.set(emptyState);
      } else if (pass !== null) {
        alert('Неверный пароль!');
      }
    }
  </script>
</body>
</html>
