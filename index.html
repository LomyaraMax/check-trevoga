<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Запрет кэширования для браузеров -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Отчет по закрытию отделений</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
  background: linear-gradient(135deg, #064e3b, #0f172a);
  border: 1px solid #10b981;
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.15);
      
      width: 100%;
      max-width: 500px;
      position: sticky;
      top: 0;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-trigger-btn {
  background: linear-gradient(135deg, #6366f1, #8b5cf6); /* Плавный фиолетовый градиент */
  border: none;
  color: #ffffff;
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
}

.chat-trigger-btn:hover {
  background: linear-gradient(135deg, #4f46e5, #7c3aed);
  transform: scale(1.08);
  box-shadow: 0 4px 16px rgba(139, 92, 246, 0.6);
}

    
    .chat-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background-color: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 2px 6px;
      display: none;
      border: 2px solid #1e293b;
    }

    .counter {
      background-color: #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #38bdf8;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      border: 1px solid transparent;
    }

    .counter:hover {
      background-color: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 40px 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .grid {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .card.is-closed {
      border-color: #22c55e;
    }

    .branch-name {
      font-weight: 500;
      font-size: 1rem;
    }

    .status-btn {
      background-color: #334155;
      color: #94a3b8;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      min-width: 110px;
    }

    .status-btn.active {
      background-color: #22c55e;
      color: #052e16;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }

    .no-results {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.95rem;
    }

    .footer {
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-top: auto;
      bottom: 5px;
      padding-bottom: 5px;
      position: sticky;
      padding-top: 10px;
    }

    .reset-btn {
      background-color: #0f172a;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .reset-btn:active {
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* Общие стили модальных окон */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      border: 1px solid #334155;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .modal-header {
      padding: 5px 10px;
      background-color: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header-title {
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    .modal-close-btn:hover {
      color: #f8fafc;
    }

    /* Модалка непроголосовавших отделений */
    .pending-body {
      padding: 20px;
      max-height: 70vh;
      overflow-y: auto;
    }

    .pending-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
      gap: 10px;
    }

    .pending-badge {
      background-color: #0f172a;
      border: 1px solid #334155;
      color: #38bdf8;
      font-weight: 700;
      font-size: 1.05rem;
      padding: 12px 8px;
      border-radius: 10px;
      text-align: center;
      transition: all 0.3s ease;
      opacity: 1;
      transform: scale(1);
    }

    /* Анимация исчезновения плашки при отметке */
    .pending-badge.fade-out {
      opacity: 0;
      transform: scale(0.7);
    }

    .pending-empty {
      text-align: center;
      color: #22c55e;
      font-weight: 600;
      padding: 30px 10px;
      font-size: 1.1rem;
    }

    /* Чат модалка */
    .chat-modal {
      height: 80vh;
      max-height: 600px;
    }

    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .chat-message {
      background-color: #0f172a;
      border: 1px solid #334155;
      padding: 8px 12px;
      border-radius: 10px;
      max-width: 85%;
      word-wrap: break-word;
      align-self: flex-start;
    }

    .chat-message.my-message {
      align-self: flex-end;
      background-color: #1e3a8a;
      border-color: #3b82f6;
    }

    .message-meta {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 0.75rem;
      margin-bottom: 4px;
    }

    .message-sender {
      font-weight: 700;
    }

    .message-time {
      color: #64748b;
    }

    .message-text {
      font-size: 0.95rem;
      line-height: 1.35;
      color: #f1f5f9;
    }

    .chat-input-area {
      padding: 7px;
      background-color: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }

    .chat-input {
      flex: 1;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .chat-input:focus {
      border-color: #38bdf8;
      max-width: 80%;
    }

    .chat-send-btn {
      background-color: #38bdf8;
      color: #0f172a;
      border: none;
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .chat-send-btn:hover {
      background-color: #0284c7;
      color: #fff;
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="header">
    <div class="title">Контроль закрытия</div>
    <div class="header-controls">
      <button class="chat-trigger-btn" id="openChatBtn" onclick="openChat()" title="Открыть анонимный чат">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="chat-badge" id="chatBadge">0</span>
      </button>
      <div class="counter" id="counter" onclick="openPendingModal()" title="Нажмите, чтобы увидеть незакрытые">0 / 20</div>
    </div>
  </div>

  <div class="search-container">
    <input 
      type="number" 
      id="searchInput" 
      class="search-input" 
      placeholder="Введите № отделения..."
    >
    <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>

  <div class="grid" id="branchesGrid"></div>

  <div class="footer">
    <button class="reset-btn" id="resetBtn" onclick="resetAll()">Сбросить всё пароль (00) [00:30]</button>
  </div>

  <!-- Модальное окно чата -->
  <div class="modal-overlay" id="chatModalOverlay" onclick="handleOverlayClick(event, 'chat')">
    <div class="modal-card chat-modal">
      <div class="modal-header">
        <div class="modal-header-title">
          <span>💬 Анонимный чат</span>
        </div>
        <button class="modal-close-btn" onclick="closeChat()">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <form class="chat-input-area" onsubmit="sendMessage(event)">
        <input type="text" id="chatInput" class="chat-input" placeholder="Напишите сообщение..." maxlength="300" autocomplete="off">
        <button type="submit" class="chat-send-btn">Отпр...</button>
      </form>
    </div>
  </div>

  <!-- Модальное окно непроголосовавших отделений -->
  <div class="modal-overlay" id="pendingModalOverlay" onclick="handleOverlayClick(event, 'pending')">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-header-title">
          <span>⏳ Осталось закрыть</span>
        </div>
        <button class="modal-close-btn" onclick="closePendingModal()">✕</button>
      </div>
      <div class="pending-body">
        <div class="pending-grid" id="pendingGrid"></div>
      </div>
    </div>
  </div>

  <script>
    const BRANCH_NUMBERS = [
      51, 37, 57, 7, 124, 148, 88, 127, 119, 68, 
      163, 76, 95, 98, 96, 122, 50, 53, 17, 110
    ];

    const INITIAL_STATUSES = {
      "51": false, "37": false, "57": false, "7": false, "124": false,
      "148": false, "88": false, "127": false, "119": false, "68": false,
      "163": false, "76": false, "95": false, "98": false, "96": false,
      "122": false, "50": false, "53": false, "17": false, "110": false
    };

    const TIMEOUT_MS = 6 * 60 * 1000; 

    const firebaseConfig = {
      apiKey: "AIzaSyArdBRpk8EyzBJ_Uruk2rYGzlzdS-Eaj50",
      authDomain: "mid-np-470dc.firebaseapp.com",
      databaseURL: "https://mid-np-470dc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mid-np-470dc",
      storageBucket: "mid-np-470dc.firebasestorage.app",
      messagingSenderId: "1051368843938",
      appId: "1:1051368843938:web:bf019281005027580345fb",
      measurementId: "G-YERGDJ4FXT"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const branchesRef = db.ref('branches_map_v3');
    const lastActivityRef = db.ref('last_activity_v3');
    const chatRef = db.ref('chat_messages_v1');

    let serverTimeOffset = 0;
    db.ref('.info/serverTimeOffset').on('value', (snap) => {
      serverTimeOffset = snap.val() || 0;
    });

    const STORAGE_KEY_FILTER = 'branches_filter_app';
    const STORAGE_KEY_USER_ID = 'chat_user_id';
    const STORAGE_KEY_USER_COLOR = 'chat_user_color';

    // Анонимные параметры пользователя
    let myUserId = localStorage.getItem(STORAGE_KEY_USER_ID);
    if (!myUserId) {
      myUserId = 'Аноним #' + Math.floor(100 + Math.random() * 900);
      localStorage.setItem(STORAGE_KEY_USER_ID, myUserId);
    }

    let myUserColor = localStorage.getItem(STORAGE_KEY_USER_COLOR);
    if (!myUserColor) {
      const colors = ['#38bdf8', '#4ade80', '#f43f5e', '#fbbf24', '#c084fc', '#f97316'];
      myUserColor = colors[Math.floor(Math.random() * colors.length)];
      localStorage.setItem(STORAGE_KEY_USER_COLOR, myUserColor);
    }

    let branchStatus = { ...INITIAL_STATUSES };
    let lastActivityTimestamp = null;
    let savedFilter = localStorage.getItem(STORAGE_KEY_FILTER) || '';
    let wasExpiredState = false;

    // Звук
    let audioCtx = null;
    let hasPlayedSoundThisCycle = false;

    // Чат
    let isChatOpen = false;
    let unreadCount = 0;
    let isInitialChatLoad = true;

    // Модалка списка
    let isPendingModalOpen = false;

    const gridEl = document.getElementById('branchesGrid');
    const counterEl = document.getElementById('counter');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');
    
    const chatModalOverlay = document.getElementById('chatModalOverlay');
    const chatMessagesEl = document.getElementById('chatMessages');
    const chatInputEl = document.getElementById('chatInput');
    const chatBadgeEl = document.getElementById('chatBadge');

    const pendingModalOverlay = document.getElementById('pendingModalOverlay');
    const pendingGridEl = document.getElementById('pendingGrid');

    // Активация аудио
    document.addEventListener('click', () => {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }, { once: false });

    // Закрытие активных модалок по Esc
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (isChatOpen) closeChat();
        if (isPendingModalOpen) closePendingModal();
      }
    });

    function playSuccessSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }

        const now = audioCtx.currentTime;

        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.3);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(880.00, now + 0.15);
        gain2.gain.setValueAtTime(0.4, now + 0.15);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.15);
        osc2.stop(now + 0.6);
      } catch (e) {
        console.log("Ошибка звука:", e);
      }
    }

    searchInput.value = savedFilter;

    lastActivityRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        lastActivityTimestamp = val;
        updateTimerAndState();
      }
    });

    branchesRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        branchesRef.set(INITIAL_STATUSES);
        lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
      } else {
        branchStatus = data;
        renderGrid();
        renderPendingGrid();
        updateTimerAndState();
      }
    }, (error) => {
      console.error("Ошибка чтения Firebase:", error);
      gridEl.innerHTML = '<div class="no-results">Ошибка подключения к базе данных!</div>';
    });

    // Слушатель чата
    chatRef.limitToLast(50).on('value', (snapshot) => {
      const data = snapshot.val();
      chatMessagesEl.innerHTML = '';

      if (data) {
        const messages = Object.values(data);
        messages.forEach(msg => {
          renderChatMessage(msg);
        });

        if (isInitialChatLoad) {
          isInitialChatLoad = false;
        } else if (!isChatOpen) {
          unreadCount++;
          updateBadge();
        }

        if (isChatOpen) {
          scrollChatToBottom();
        }
      } else {
        chatMessagesEl.innerHTML = '<div class="no-results">Сообщений пока нет...</div>';
      }
    });

    function renderChatMessage(msg) {
      const isMine = msg.senderId === myUserId;
      const msgDiv = document.createElement('div');
      msgDiv.className = `chat-message ${isMine ? 'my-message' : ''}`;

      const metaDiv = document.createElement('div');
      metaDiv.className = 'message-meta';

      const senderSpan = document.createElement('span');
      senderSpan.className = 'message-sender';
      senderSpan.textContent = isMine ? 'Вы' : msg.senderId;
      senderSpan.style.color = isMine ? '#93c5fd' : (msg.color || '#38bdf8');

      const timeSpan = document.createElement('span');
      timeSpan.className = 'message-time';
      
      const date = new Date(msg.timestamp);
      const hours = String(date.getHours()).padStart(2, '0');
      const mins = String(date.getMinutes()).padStart(2, '0');
      timeSpan.textContent = `${hours}:${mins}`;

      metaDiv.appendChild(senderSpan);
      metaDiv.appendChild(timeSpan);

      const textDiv = document.createElement('div');
      textDiv.className = 'message-text';
      textDiv.textContent = msg.text;

      msgDiv.appendChild(metaDiv);
      msgDiv.appendChild(textDiv);
      chatMessagesEl.appendChild(msgDiv);
    }

    function sendMessage(e) {
      e.preventDefault();
      const text = chatInputEl.value.trim();
      if (!text) return;

      const newMsg = {
        text: text,
        senderId: myUserId,
        color: myUserColor,
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      chatRef.push(newMsg);
      chatInputEl.value = '';
    }

    function openChat() {
      isChatOpen = true;
      chatModalOverlay.classList.add('active');
      unreadCount = 0;
      updateBadge();
      scrollChatToBottom();
      setTimeout(() => chatInputEl.focus(), 100);
    }

    function closeChat() {
      isChatOpen = false;
      chatModalOverlay.classList.remove('active');
    }

    function openPendingModal() {
      isPendingModalOpen = true;
      renderPendingGrid(true); // Заново перерисовываем
      pendingModalOverlay.classList.add('active');
    }

    function closePendingModal() {
      isPendingModalOpen = false;
      pendingModalOverlay.classList.remove('active');
    }

    function handleOverlayClick(e, type) {
      if (type === 'chat' && e.target === chatModalOverlay) closeChat();
      if (type === 'pending' && e.target === pendingModalOverlay) closePendingModal();
    }

    function updateBadge() {
      if (unreadCount > 0) {
        chatBadgeEl.textContent = unreadCount > 99 ? '99+' : unreadCount;
        chatBadgeEl.style.display = 'block';
      } else {
        chatBadgeEl.style.display = 'none';
      }
    }

    function scrollChatToBottom() {
      setTimeout(() => {
        chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      }, 50);
    }

    function updateTimerAndState() {
      if (!lastActivityTimestamp) return;

      const currentServerTime = Date.now() + serverTimeOffset;
      const elapsed = currentServerTime - lastActivityTimestamp;
      const remaining = TIMEOUT_MS - elapsed;

      if (remaining <= 0) {
        resetBtn.textContent = "Сбросить всё пароль (00) [00:00]";
        
        if (!wasExpiredState) {
          wasExpiredState = true;
          renderGrid();
          renderPendingGrid();
        }
      } else {
        if (wasExpiredState) {
          wasExpiredState = false;
          renderGrid();
          renderPendingGrid();
        }
        
        const totalSeconds = Math.floor(remaining / 1000);
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        resetBtn.textContent = `Сбросить всё пароль (00) [${timeStr}]`;
      }
    }

    setInterval(updateTimerAndState, 1000);

    function renderGrid() {
      gridEl.innerHTML = '';
      let closedCount = 0;
      const filterValue = searchInput.value.trim();

      clearSearchBtn.style.display = filterValue ? 'block' : 'none';
      let renderedCardsCount = 0;

      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      BRANCH_NUMBERS.forEach((branchNum) => {
        const numStr = branchNum.toString();
        
        const rawStatus = !!branchStatus[numStr];
        const isClosed = isExpired ? false : rawStatus;
        
        if (isClosed) closedCount++;

        if (filterValue !== '' && numStr !== filterValue) {
          return;
        }

        renderedCardsCount++;

        const card = document.createElement('div');
        card.className = `card ${isClosed ? 'is-closed' : ''}`;

        const name = document.createElement('span');
        name.className = 'branch-name';
        name.textContent = `Отделение №${numStr}`;

        const btn = document.createElement('button');
        btn.className = `status-btn ${isClosed ? 'active' : ''}`;
        btn.textContent = isClosed ? 'ЗАКРЫТО' : 'Не закрыто';
        btn.onclick = () => toggleBranch(numStr);

        card.appendChild(name);
        card.appendChild(btn);
        gridEl.appendChild(card);
      });

      if (renderedCardsCount === 0) {
        gridEl.innerHTML = '<div class="no-results">Отделение не найдено</div>';
      }

      // Проверка на 20/20 и звук
      if (closedCount === BRANCH_NUMBERS.length && !isExpired) {
        if (!hasPlayedSoundThisCycle) {
          playSuccessSound();
          hasPlayedSoundThisCycle = true;
        }
      } else {
        hasPlayedSoundThisCycle = false;
      }

      counterEl.textContent = `${closedCount} / ${BRANCH_NUMBERS.length}`;
    }

    // Отрисовка списка еще НЕ проголосовавших отделений с плавной анимацией
    function renderPendingGrid(forceFullRebuild = false) {
      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      // Формируем список тех, кто еще не закрыт
      const pendingNumbers = BRANCH_NUMBERS.filter(num => {
        const isClosed = isExpired ? false : !!branchStatus[num.toString()];
        return !isClosed;
      });

      if (pendingNumbers.length === 0) {
        pendingGridEl.innerHTML = '<div class="pending-empty">🎉 Все отделения успешно закрыты!</div>';
        return;
      }

      if (forceFullRebuild || pendingGridEl.querySelector('.pending-empty')) {
        pendingGridEl.innerHTML = '';
        pendingNumbers.forEach(num => {
          const badge = document.createElement('div');
          badge.className = 'pending-badge';
          badge.dataset.num = num;
          badge.textContent = `№${num}`;
          pendingGridEl.appendChild(badge);
        });
      } else {
        // Умное обновление с анимацией исчезновения
        const existingBadges = pendingGridEl.querySelectorAll('.pending-badge');
        existingBadges.forEach(badge => {
          const num = parseInt(badge.dataset.num, 10);
          if (!pendingNumbers.includes(num) && !badge.classList.contains('fade-out')) {
            badge.classList.add('fade-out');
            setTimeout(() => {
              badge.remove();
              if (pendingGridEl.children.length === 0) {
                pendingGridEl.innerHTML = '<div class="pending-empty">🎉 Все отделения успешно закрыты!</div>';
              }
            }, 300);
          }
        });

        // Добавляем новые (если статус изменился обратно)
        pendingNumbers.forEach(num => {
          let badge = pendingGridEl.querySelector(`[data-num="${num}"]`);
          if (!badge) {
            badge = document.createElement('div');
            badge.className = 'pending-badge';
            badge.dataset.num = num;
            badge.textContent = `№${num}`;
            pendingGridEl.appendChild(badge);
          }
        });
      }
    }

    function toggleBranch(branchNumStr) {
      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      if (isExpired) {
        const newMap = {};
        BRANCH_NUMBERS.forEach(num => newMap[num.toString()] = false);
        newMap[branchNumStr] = true;

        branchesRef.set(newMap);
      } else {
        const newStatus = !branchStatus[branchNumStr];
        db.ref(`branches_map_v3/${branchNumStr}`).set(newStatus);
      }

      lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
    }

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      localStorage.setItem(STORAGE_KEY_FILTER, val);
      renderGrid();
    });

    function clearSearch() {
      searchInput.value = '';
      localStorage.removeItem(STORAGE_KEY_FILTER);
      renderGrid();
    }

    function resetAll() {
      const pass = prompt('Введите пароль для сброса:');
      if (pass === '00') {
        const resetState = {};
        BRANCH_NUMBERS.forEach(num => resetState[num] = false);
        branchesRef.set(resetState);
        lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
      } else if (pass !== null) {
        alert('Неверный пароль!');
      }
    }
  </script>
</body>
</html>
