<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Запрет кэширования для браузеров -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Отчет по закрытию отделений</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .header {
      width: 100%;
      max-width: 500px;
      position: sticky;
      top: 0;
      background-color: #1e293b;
      padding: 16px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .counter {
      background-color: #334155;
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #38bdf8;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 12px 40px 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .grid {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s ease;
    }

    .card.is-closed {
      border-color: #22c55e;
    }

    .branch-name {
      font-weight: 500;
      font-size: 1rem;
    }

    .status-btn {
      background-color: #334155;
      color: #94a3b8;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      min-width: 110px;
    }

    .status-btn.active {
      background-color: #22c55e;
      color: #052e16;
      box-shadow: 0 0 12px rgba(34, 197, 94, 0.6);
    }

    .no-results {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.95rem;
    }

    .footer {
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-top: auto;
      bottom: 0px;
      padding-bottom: 5px;
      position: sticky;
      padding-top: 10px;
    }

    .reset-btn {
      background-color: #0f172a;
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .reset-btn:active {
      background-color: rgba(239, 68, 68, 0.1);
    }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="header">
    <div class="title">Контроль закрытия</div>
    <div class="counter" id="counter">0 / 20</div>
  </div>

  <div class="search-container">
    <input 
      type="number" 
      id="searchInput" 
      class="search-input" 
      placeholder="Введите № отделения..."
    >
    <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>

  <div class="grid" id="branchesGrid"></div>

  <div class="footer">
    <button class="reset-btn" id="resetBtn" onclick="resetAll()">Сбросить всё пароль (00) [12:00]</button>
  </div>

  <script>
    const BRANCH_NUMBERS = [
      51, 37, 57, 7, 124, 148, 88, 127, 119, 68, 
      163, 76, 95, 98, 96, 122, 50, 53, 17, 110
    ];

    const INITIAL_STATUSES = {
      "51": false, "37": false, "57": false, "7": false, "124": false,
      "148": false, "88": false, "127": false, "119": false, "68": false,
      "163": false, "76": false, "95": false, "98": false, "96": false,
      "122": false, "50": false, "53": false, "17": true, "110": true
    };

    const TIMEOUT_MS = 2 * 60 * 1000; // 12 минут

    const firebaseConfig = {
      apiKey: "AIzaSyArdBRpk8EyzBJ_Uruk2rYGzlzdS-Eaj50",
      authDomain: "mid-np-470dc.firebaseapp.com",
      databaseURL: "https://mid-np-470dc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mid-np-470dc",
      storageBucket: "mid-np-470dc.firebasestorage.app",
      messagingSenderId: "1051368843938",
      appId: "1:1051368843938:web:bf019281005027580345fb",
      measurementId: "G-YERGDJ4FXT"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    const branchesRef = db.ref('branches_map_v3');
    const lastActivityRef = db.ref('last_activity_v3');

    let serverTimeOffset = 0;
    db.ref('.info/serverTimeOffset').on('value', (snap) => {
      serverTimeOffset = snap.val() || 0;
    });

    const STORAGE_KEY_FILTER = 'branches_filter_app';

    let branchStatus = { ...INITIAL_STATUSES };
    let lastActivityTimestamp = null;
    let savedFilter = localStorage.getItem(STORAGE_KEY_FILTER) || '';

    const gridEl = document.getElementById('branchesGrid');
    const counterEl = document.getElementById('counter');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');

    searchInput.value = savedFilter;

    lastActivityRef.on('value', (snapshot) => {
      const val = snapshot.val();
      if (val) {
        lastActivityTimestamp = val;
        updateTimerUI();
      }
    });

    branchesRef.on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data) {
        branchesRef.set(INITIAL_STATUSES);
        lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
      } else {
        branchStatus = data;
        renderGrid();
        updateTimerUI();
      }
    }, (error) => {
      console.error("Ошибка чтения Firebase:", error);
      gridEl.innerHTML = '<div class="no-results">Ошибка подключения к базе данных!</div>';
    });

    function updateTimerUI() {
      if (!lastActivityTimestamp) return;

      const currentServerTime = Date.now() + serverTimeOffset;
      const elapsed = currentServerTime - lastActivityTimestamp;
      const remaining = TIMEOUT_MS - elapsed;

      if (remaining <= 0) {
        resetBtn.textContent = "Сбросить всё пароль (00) [00:00]";
      } else {
        const totalSeconds = Math.floor(remaining / 1000);
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        const timeStr = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
        resetBtn.textContent = `Сбросить всё пароль (00) [${timeStr}]`;
      }
    }

    setInterval(updateTimerUI, 1000);

    function renderGrid() {
      gridEl.innerHTML = '';
      let closedCount = 0;
      const filterValue = searchInput.value.trim();

      clearSearchBtn.style.display = filterValue ? 'block' : 'none';
      let renderedCardsCount = 0;

      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      BRANCH_NUMBERS.forEach((branchNum) => {
        const numStr = branchNum.toString();
        
        const rawStatus = !!branchStatus[numStr];
        const isClosed = isExpired ? false : rawStatus;
        
        if (isClosed) closedCount++;

        if (filterValue !== '' && numStr !== filterValue) {
          return;
        }

        renderedCardsCount++;

        const card = document.createElement('div');
        card.className = `card ${isClosed ? 'is-closed' : ''}`;

        const name = document.createElement('span');
        name.className = 'branch-name';
        name.textContent = `Отделение №${numStr}`;

        const btn = document.createElement('button');
        btn.className = `status-btn ${isClosed ? 'active' : ''}`;
        btn.textContent = isClosed ? 'ЗАКРЫТО' : 'Не закрыто';
        btn.onclick = () => toggleBranch(numStr);

        card.appendChild(name);
        card.appendChild(btn);
        gridEl.appendChild(card);
      });

      if (renderedCardsCount === 0) {
        gridEl.innerHTML = '<div class="no-results">Отделение не найдено</div>';
      }

      counterEl.textContent = `${closedCount} / ${BRANCH_NUMBERS.length}`;
    }

    function toggleBranch(branchNumStr) {
      const currentServerTime = Date.now() + serverTimeOffset;
      const isExpired = lastActivityTimestamp && ((currentServerTime - lastActivityTimestamp) >= TIMEOUT_MS);

      if (isExpired) {
        const newMap = {};
        BRANCH_NUMBERS.forEach(num => newMap[num.toString()] = false);
        newMap[branchNumStr] = true;

        branchesRef.set(newMap);
      } else {
        const newStatus = !branchStatus[branchNumStr];
        db.ref(`branches_map_v3/${branchNumStr}`).set(newStatus);
      }

      lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
    }

    searchInput.addEventListener('input', (e) => {
      const val = e.target.value.trim();
      localStorage.setItem(STORAGE_KEY_FILTER, val);
      renderGrid();
    });

    function clearSearch() {
      searchInput.value = '';
      localStorage.removeItem(STORAGE_KEY_FILTER);
      renderGrid();
    }

    function resetAll() {
      const pass = prompt('Введите пароль для сброса:');
      if (pass === '00') {
        const resetState = {};
        BRANCH_NUMBERS.forEach(num => resetState[num] = false);
        branchesRef.set(resetState);
        lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
      } else if (pass !== null) {
        alert('Неверный пароль!');
      }
    }
  </script>
</body>
</html>
