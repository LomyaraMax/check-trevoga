<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Запрет кэширования для браузеров -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>Отчет по закрытию отделений и График</title>

  <style>
    /* ==========================================
       ПЕРЕМЕННЫЕ ТЕМ ОФОРМЛЕНИЯ
       ========================================== */
    :root {
      --bg-color: #0f172a;
      --text-color: #f8fafc;
      --header-bg: linear-gradient(135deg, #0f172a, #1e293b);
      --header-border: #334155;
      --card-bg: linear-gradient(135deg, #1e293b, #0f172a);
      --card-border: #334155;
      --card-hover-border: #475569;
      --card-closed-bg: linear-gradient(135deg, #064e3b, #0f172a);
      --card-closed-border: rgba(34, 197, 94, 0.4);
      --input-bg: #1e293b;
      --input-border: #334155;
      --input-text: #f8fafc;
      --status-btn-bg: rgba(51, 65, 85, 0.6);
      --status-btn-text: #94a3b8;
      --status-btn-border: #334155;
      --status-btn-active-bg: linear-gradient(135deg, #22c55e, #16a34a);
      --status-btn-active-text: #ffffff;
      --status-btn-active-shadow: 0 0 14px rgba(34, 197, 94, 0.4);
      --modal-bg: #0f172a;
      --modal-border: #334155;
      --modal-overlay: rgba(15, 23, 42, 0.8);
      --badge-bg: #0f172a;
      --badge-border: #334155;
      --theme-btn-bg: #1e293b;
      --theme-btn-border: #334155;
      --theme-btn-color: #fbbf24;
      --chat-msg-other-bg: #1e293b;
      --chat-msg-other-border: rgba(255, 255, 255, 0.08);
      --chat-msg-text: #f8fafc;

      /* Цвета графика */
      --color-98-bg: #1d4ed8;
      --color-98-text: #ffffff;
      --color-163-bg: #d97706;
      --color-163-text: #ffffff;
      --color-vh-bg: #15803d;
      --color-vh-text: #ffffff;
    }

    [data-theme="light"] {
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --header-bg: #ffffff;
      --header-border: #e2e8f0;
      --card-bg: #ffffff;
      --card-border: #e2e8f0;
      --card-hover-border: #cbd5e1;
      --card-closed-bg: #f0fdf4;
      --card-closed-border: #86efac;
      --input-bg: #ffffff;
      --input-border: #cbd5e1;
      --input-text: #0f172a;
      
      --status-btn-bg: #f1f5f9;
      --status-btn-text: #64748b;
      --status-btn-border: #cbd5e1;
      
      --status-btn-active-bg: linear-gradient(135deg, #4ade80, #22c55e);
      --status-btn-active-text: #ffffff;
      --status-btn-active-shadow: 0 4px 12px rgba(34, 197, 94, 0.25);
      
      --modal-bg: #ffffff;
      --modal-border: #e2e8f0;
      --modal-overlay: rgba(15, 23, 42, 0.3);
      --badge-bg: #ffffff;
      --badge-border: #e2e8f0;
      --theme-btn-bg: #f1f5f9;
      --theme-btn-border: #cbd5e1;
      --theme-btn-color: #4f46e5;
      --chat-msg-other-bg: #f1f5f9;
      --chat-msg-other-border: #e2e8f0;
      --chat-msg-text: #0f172a;

      /* Цвета графика в светлой теме */
      --color-98-bg: #3b82f6;
      --color-98-text: #ffffff;
      --color-163-bg: #fef3c7;
      --color-163-text: #78350f;
      --color-vh-bg: #22c55e;
      --color-vh-text: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    body.modal-open {
      overflow: hidden !important;
      touch-action: none;
    }

    .header {
      background: var(--header-bg);
      border: 1px solid var(--header-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      width: 100%;
      max-width: 500px;
      position: sticky;
      top: 0;
      padding: 12px 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
      transition: all 0.3s ease;
    }

    .title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-toggle-btn, .icon-trigger-btn {
      background: var(--theme-btn-bg);
      border: 1px solid var(--theme-btn-border);
      color: var(--text-color);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
      flex-shrink: 0;
    }

    .theme-toggle-btn {
      color: var(--theme-btn-color);
    }

    .theme-toggle-btn:hover, .icon-trigger-btn:hover {
      transform: scale(1.08);
    }

    .chat-trigger-btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: #ffffff;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
      flex-shrink: 0;
    }

    .chat-trigger-btn:hover {
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      transform: scale(1.08);
    }

    .chat-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      background-color: #ef4444;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      border-radius: 10px;
      padding: 2px 6px;
      display: none;
      border: 2px solid var(--modal-bg);
    }

    .counter {
      background: rgba(56, 189, 248, 0.12);
      color: #0284c7;
      border: 1px solid rgba(56, 189, 248, 0.4);
      padding: 6px 10px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    [data-theme="dark"] .counter {
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.3);
    }

    .counter:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }

    .search-container {
      width: 100%;
      max-width: 500px;
      margin-bottom: 16px;
      position: relative;
    }

    .search-input {
      width: 100%;
      background-color: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 12px 40px 12px 16px;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, background-color 0.3s ease;
    }

    .search-input:focus {
      border-color: #38bdf8;
    }

    .clear-search-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.2rem;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    .grid {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 30px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    }

    .card:hover {
      border-color: var(--card-hover-border);
      transform: translateY(-1px);
    }

    .card.is-closed {
      border-color: var(--card-closed-border);
      background: var(--card-closed-bg);
    }

    .branch-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-color);
      letter-spacing: 0.3px;
    }

    .status-btn {
      background-color: var(--status-btn-bg);
      color: var(--status-btn-text);
      border: 1px solid var(--status-btn-border);
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      outline: none;
      transition: all 0.2s ease;
      min-width: 115px;
      text-align: center;
      touch-action: manipulation;
    }

    .status-btn:hover {
      filter: brightness(0.95);
    }

    .status-btn.active {
      background: var(--status-btn-active-bg);
      color: var(--status-btn-active-text);
      border-color: #22c55e;
      font-weight: 700;
      box-shadow: var(--status-btn-active-shadow);
    }

    .status-btn.active:hover {
      filter: brightness(1.05);
      transform: scale(1.02);
    }

    .no-results {
      text-align: center;
      color: #94a3b8;
      padding: 20px;
      font-size: 0.95rem;
    }

    .footer {
      width: 100%;
      max-width: 500px;
      text-align: center;
      margin-top: auto;
      bottom: 5px;
      padding-bottom: 5px;
      position: sticky;
      padding-top: 10px;
    }

    .reset-btn {
      background-color: var(--bg-color);
      color: #ef4444;
      border: 1px solid #ef4444;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.2s ease;
    }

    .reset-btn:active {
      background-color: rgba(239, 68, 68, 0.1);
    }

    /* МОДАЛЬНЫЕ ОКНА Общие */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: var(--modal-overlay);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      padding: 16px;
      overscroll-behavior: contain;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      border: 1px solid var(--modal-border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      background-color: var(--modal-bg);
      color: var(--text-color);
    }

    .modal-header {
      padding: 12px 16px;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--modal-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header-title {
      font-weight: 600;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .modal-close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.4rem;
      cursor: pointer;
      padding: 4px;
      line-height: 1;
    }

    /* ОКНО КАЛЕНДАРЯ ГРАФИКА */
    .calendar-modal-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 85vh;
      overflow-y: auto;
    }

    .auth-block {
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
      padding: 20px 10px;
    }

    .pass-input {
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      color: var(--input-text);
      padding: 12px;
      border-radius: 10px;
      font-size: 1.1rem;
      text-align: center;
      outline: none;
    }

    .pass-btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    .calendar-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 8px 12px;
      border-radius: 10px;
    }

    .cal-btn {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--text-color);
      width: 30px; height: 30px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .cal-title {
      font-weight: 700;
    }

    .cal-legend {
      display: flex;
      justify-content: space-around;
      font-size: 0.75rem;
      font-weight: 600;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
    }

    .leg-item { display: flex; align-items: center; gap: 4px; }
    .leg-dot { width: 10px; height: 10px; border-radius: 2px; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .cal-weekday {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: #94a3b8;
    }

    .cal-day {
      aspect-ratio: 1;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 4px;
      cursor: pointer;
      user-select: none;
    }

    .cal-day.empty {
      opacity: 0.1;
      pointer-events: none;
      border: none;
      background: transparent;
    }

    .cal-day-num { font-size: 0.75rem; font-weight: 600; align-self: flex-start; }
    .cal-day-badge { font-size: 0.7rem; font-weight: 800; line-height: 1; }

    /* Стили назначенных смен */
    .cal-day.st-98 { background: var(--color-98-bg); color: var(--color-98-text); border-color: transparent; }
    .cal-day.st-163 { background: var(--color-163-bg); color: var(--color-163-text); border-color: transparent; }
    .cal-day.st-vh { background: var(--color-vh-bg); color: var(--color-vh-text); border-color: transparent; }

    /* МОДАЛКА ВЫБОРА СМЕНЫ В ДЕНЬ */
    .shift-modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--modal-border);
      border-radius: 14px;
      padding: 16px;
      width: 280px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shift-opt-btn {
      padding: 10px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }

    .opt-98 { background: var(--color-98-bg); }
    .opt-163 { background: var(--color-163-bg); color: var(--color-163-text); }
    .opt-vh { background: var(--color-vh-bg); }
    .opt-reset { background: transparent; border: 1px solid var(--card-border); color: #ef4444; }

    /* ЧАТ */
    .chat-modal {
      height: 85vh;
      max-height: 650px;
    }

    .chat-messages::-webkit-scrollbar, .sticker-picker::-webkit-scrollbar { width: 5px; }
    .chat-messages::-webkit-scrollbar-thumb, .sticker-picker::-webkit-scrollbar-thumb { background: var(--status-btn-border); border-radius: 10px; }

    .chat-messages {
      flex: 1; padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: var(--bg-color); overscroll-behavior: contain;
    }

    .chat-message {
      position: relative; background: var(--chat-msg-other-bg); border: 1px solid var(--chat-msg-other-border); padding: 10px 14px; border-radius: 16px 16px 16px 4px; max-width: 80%; word-wrap: break-word; align-self: flex-start; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    .chat-message.my-message {
      align-self: flex-end; background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 16px 16px 4px 16px;
    }

    .message-meta { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 0.72rem; margin-bottom: 4px; }
    .message-sender { font-weight: 700; }
    .chat-message.my-message .message-sender { color: #e0f2fe !important; }
    .message-time { color: var(--status-btn-text); font-size: 0.68rem; }
    .chat-message.my-message .message-time { color: rgba(255, 255, 255, 0.8); }
    .message-text { font-size: 0.95rem; line-height: 1.4; color: var(--chat-msg-text); }
    .chat-message.my-message .message-text { color: #ffffff; }

    .chat-input-area { padding: 10px 14px; background: var(--header-bg); border-top: 1px solid var(--modal-border); display: flex; align-items: center; gap: 10px; }
    .sticker-toggle-btn { background: var(--status-btn-bg); border: 1px solid var(--status-btn-border); font-size: 1.2rem; cursor: pointer; width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
    .chat-input { flex: 1; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--input-text); padding: 10px 16px; border-radius: 12px; font-size: 0.95rem; outline: none; }
    .chat-send-btn { width: 42px; height: 40px; background: linear-gradient(135deg, #38bdf8, #0284c7); color: #ffffff; border: none; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; }

    .sticker-picker { background: var(--modal-bg); border-top: 1px solid var(--modal-border); padding: 12px 14px; display: none; flex-direction: column; gap: 10px; max-height: 260px; overflow-y: auto; }
    .sticker-picker.active { display: flex; }
    .sticker-grid { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; }
    .sticker-item { display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 8px; background: var(--status-btn-bg); border: 1px solid var(--status-btn-border); border-radius: 12px; }
    .sticker-item img { width: 40px; height: 40px; object-fit: contain; }

    .chat-message.is-sticker { background: transparent !important; border: none !important; padding: 4px !important; box-shadow: none !important; }
    .chat-message.is-sticker img.tg-sticker-img { width: 110px; height: 110px; object-fit: contain; display: block; }

    /* ОСТАТОК МОДАЛКА */
    .pending-body { padding: 20px; max-height: 70vh; overflow-y: auto; }
    .pending-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 10px; }
    .pending-badge { background-color: var(--badge-bg); border: 1px solid var(--badge-border); color: #0284c7; font-weight: 700; font-size: 1.05rem; padding: 12px 8px; border-radius: 10px; text-align: center; }
    [data-theme="dark"] .pending-badge { color: #38bdf8; }
    .pending-empty { text-align: center; color: #22c55e; font-weight: 600; padding: 30px 10px; font-size: 1.1rem; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

  <div class="header">
    <div class="title">КЗ</div>
    <div class="header-controls">
      <!-- Иконка Календаря графика с паролем -->
      <button class="icon-trigger-btn" onclick="openScheduleModal()" title="График работы (Пароль)"><svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент для шапки -->
    <linearGradient id="calHeaderGrad" x1="8" y1="12" x2="56" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <!-- Градиент для тела -->
    <linearGradient id="calBodyGrad" x1="8" y1="26" x2="56" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Тень под иконкой -->
    <filter id="shadow" x="2" y="8" width="60" height="52" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- Подложка / Тело календаря -->
    <rect x="8" y="24" width="48" height="30" rx="10" fill="url(#calBodyGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Верхняя шапка -->
    <path d="M8 22C8 16.4772 12.4772 12 18 12H46C51.5228 12 56 16.4772 56 22V26H8V22Z" fill="url(#calHeaderGrad)"/>

    <!-- Пружины / Крепления -->
    <rect x="18" y="8" width="4" height="8" rx="2" fill="#93C5FD"/>
    <rect x="42" y="8" width="4" height="8" rx="2" fill="#93C5FD"/>

    <!-- Дни (сетка точек) -->
    <circle cx="18" cy="33" r="2.2" fill="#64748B"/>
    <circle cx="27" cy="33" r="2.2" fill="#64748B"/>
    <circle cx="36" cy="33" r="2.2" fill="#64748B"/>
    <circle cx="45" cy="33" r="2.2" fill="#64748B"/>

    <circle cx="18" cy="42" r="2.2" fill="#64748B"/>
    <!-- Выделенный активный день -->
    <rect x="23" y="38" width="8" height="8" rx="3" fill="#EF4444"/>
    <circle cx="36" cy="42" r="2.2" fill="#64748B"/>
    <circle cx="45" cy="42" r="2.2" fill="#64748B"/>
  </g>
</svg>
</button>

      <!-- Переключатель темы -->
      <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Сменить тему">
        <svg id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>

      <button class="chat-trigger-btn" id="openChatBtn" onclick="openChat()" title="Открыть анонимный чат">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        <span class="chat-badge" id="chatBadge">0</span>
      </button>
      <div class="counter" id="counter" onclick="openPendingModal()" title="Нажмите, чтобы увидеть незакрытые">0 / 20</div>
    </div>
  </div>

  <div class="search-container">
    <input type="number" id="searchInput" class="search-input" placeholder="Введите № отделения...">
    <button class="clear-search-btn" id="clearSearchBtn" onclick="clearSearch()">✕</button>
  </div>

  <div class="grid" id="branchesGrid"></div>

  <div class="footer">
    <button class="reset-btn" id="resetBtn" onclick="resetAll()">Сбросить всё пароль (00) [00:30]</button>
  </div>

  <!-- МОДАЛКА КАЛЕНДАРЯ-ГРАФИКА -->
  <div class="modal-overlay" id="scheduleModalOverlay" onclick="handleOverlayClick(event, 'schedule')">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-header-title"><span>График работы</span></div>
        <button class="modal-close-btn" onclick="closeScheduleModal()">✕</button>
      </div>
      <div class="calendar-modal-body">
        
        <!-- Блок ввода пароля -->
        <div class="auth-block" id="calAuthBlock">
          <div>🔒 Вход защищен паролем</div>
          <input type="password" id="calPassInput" class="pass-input" placeholder="Пароль доступа" maxlength="10">
          <button class="pass-btn" onclick="verifyCalPass()">Войти</button>
        </div>

        <!-- Контент Календаря -->
        <div id="calContentBlock" style="display: none; flex-direction: column; gap: 12px;">
          <div class="calendar-nav">
            <button class="cal-btn" onclick="changeCalMonth(-1)">←</button>
            <div class="cal-title" id="calMonthTitle">Август 2026</div>
            <button class="cal-btn" onclick="changeCalMonth(1)">→</button>
          </div>

          <div class="cal-legend">
            <div class="leg-item"><div class="leg-dot" style="background:var(--color-98-bg)"></div> 98 отд.</div>
            <div class="leg-item"><div class="leg-dot" style="background:var(--color-163-bg)"></div> 163 отд.</div>
            <div class="leg-item"><div class="leg-dot" style="background:var(--color-vh-bg)"></div> ВХ</div>
          </div>

          <div class="cal-grid" id="calGrid"></div>
        </div>

      </div>
    </div>
  </div>

  <!-- МОДАЛКА ВЫБОРА СМЕНЫ В ДЕНЬ -->
  <div class="modal-overlay" id="shiftModalOverlay" onclick="handleOverlayClick(event, 'shift')">
    <div class="shift-modal-card">
      <div style="font-weight: 700; text-align: center;" id="shiftModalTitle">Назначить смену</div>
      <button class="shift-opt-btn opt-98" onclick="setShift('98')"><span>98 Отделение</span> <span>🟦</span></button>
      <button class="shift-opt-btn opt-163" onclick="setShift('163')"><span>163 Отделение</span> <span>🟨</span></button>
      <button class="shift-opt-btn opt-vh" onclick="setShift('vh')"><span>Выходной (ВХ)</span> <span>🟩</span></button>
      <button class="shift-opt-btn opt-reset" onclick="setShift(null)"><span>Сбросить день</span> <span>✕</span></button>
    </div>
  </div>

  <!-- Модалка чата -->
  <div class="modal-overlay" id="chatModalOverlay" onclick="handleOverlayClick(event, 'chat')">
    <div class="modal-card chat-modal">
      <div class="modal-header">
        <div class="modal-header-title"><span>💬 Анонимный чат</span></div>
        <button class="modal-close-btn" onclick="closeChat()">✕</button>
      </div>
      <div class="chat-messages" id="chatMessages"></div>
      <div class="sticker-picker" id="stickerPicker">
        <div style="font-size: 0.72rem; color: var(--status-btn-text); font-weight: 700; text-transform: uppercase;">Стикеры</div>
        <div class="sticker-grid" id="stickerGrid"></div>
      </div>
      <form class="chat-input-area" onsubmit="sendMessage(event)">
        <button type="button" class="sticker-toggle-btn" onclick="toggleStickerPicker()" title="Выбрать стикер">🤡</button>
        <input type="text" id="chatInput" class="chat-input" placeholder="Напишите сообщение..." maxlength="300" autocomplete="off">
        <button type="submit" class="chat-send-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </form>
    </div>
  </div>

  <!-- Модалка остатка -->
  <div class="modal-overlay" id="pendingModalOverlay" onclick="handleOverlayClick(event, 'pending')">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-header-title"><span>⏳ Осталось закрыть</span></div>
        <button class="modal-close-btn" onclick="closePendingModal()">✕</button>
      </div>
      <div class="pending-body"><div class="pending-grid" id="pendingGrid"></div></div>
    </div>
  </div>

  <script>
    // ==========================================
    // ТЕМА
    // ==========================================
    const STORAGE_KEY_THEME = 'app_theme';
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      localStorage.setItem(STORAGE_KEY_THEME, theme);
      if (theme === 'light') {
        sunIcon.style.display = 'none';
        moonIcon.style.display = 'block';
      } else {
        sunIcon.style.display = 'block';
        moonIcon.style.display = 'none';
      }
    }

    function toggleTheme() {
      const currentTheme = document.documentElement.getAttribute('data-theme') || 'dark';
      applyTheme(currentTheme === 'dark' ? 'light' : 'dark');
    }

    applyTheme(localStorage.getItem(STORAGE_KEY_THEME) || 'dark');

    // ==========================================
    // ДАННЫЕ И FIREBASE
    // ==========================================
    const BRANCH_NUMBERS = [51, 37, 57, 7, 124, 148, 88, 127, 119, 68, 163, 76, 95, 98, 96, 122, 50, 53, 17, 110];
    const INITIAL_STATUSES = {"51":false,"37":false,"57":false,"7":false,"124":false,"148":false,"88":false,"127":false,"119":false,"68":false,"163":false,"76":false,"95":false,"98":false,"96":false,"122":false,"50":false,"53":false,"17":false,"110":false};
    const TIMEOUT_MS = 12 * 60 * 1000;

    const TELEGRAM_STICKERS = [
      "https://em-content.zobj.net/source/telegram/386/clown-face_1f921.webp",
      "https://em-content.zobj.net/source/telegram/386/cat-with-tears-of-joy_1f639.webp",
      "https://em-content.zobj.net/source/telegram/386/crying-cat_1f63f.webp",
      "https://em-content.zobj.net/source/telegram/386/screaming-cat_1f640.webp",
      "https://em-content.zobj.net/source/telegram/386/face-with-tears-of-joy_1f602.webp",
      "https://em-content.zobj.net/source/telegram/386/partying-face_1f973.webp",
      "https://em-content.zobj.net/source/telegram/386/thumbs-up_1f44d.webp",
      "https://em-content.zobj.net/source/telegram/386/fire_1f525.webp"
    ];

    const firebaseConfig = {
      apiKey: "AIzaSyArdBRpk8EyzBJ_Uruk2rYGzlzdS-Eaj50",
      authDomain: "mid-np-470dc.firebaseapp.com",
      databaseURL: "https://mid-np-470dc-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "mid-np-470dc",
      storageBucket: "mid-np-470dc.firebasestorage.app",
      messagingSenderId: "1051368843938",
      appId: "1:1051368843938:web:bf019281005027580345fb"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function getFormattedToday() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    let selectedDate = getFormattedToday();
    let branchesRef = null;
    let lastActivityRef = null;
    const chatRef = db.ref('chat_messages_v1');

    let serverTimeOffset = 0;
    db.ref('.info/serverTimeOffset').on('value', snap => serverTimeOffset = snap.val() || 0);

    let myUserId = localStorage.getItem('chat_user_id') || ('Аноним #' + Math.floor(100 + Math.random() * 900));
    localStorage.setItem('chat_user_id', myUserId);

    let myUserColor = localStorage.getItem('chat_user_color') || ['#38bdf8', '#4ade80', '#f43f5e', '#fbbf24', '#c084fc'][Math.floor(Math.random()*5)];
    localStorage.setItem('chat_user_color', myUserColor);

    let branchStatus = { ...INITIAL_STATUSES };
    let lastActivityTimestamp = null;
    let isChatOpen = false, unreadCount = 0, isInitialChatLoad = true;

    const gridEl = document.getElementById('branchesGrid');
    const counterEl = document.getElementById('counter');
    const searchInput = document.getElementById('searchInput');
    const clearSearchBtn = document.getElementById('clearSearchBtn');
    const resetBtn = document.getElementById('resetBtn');

    function bindFirebaseDateListeners(dateStr) {
      if (branchesRef) branchesRef.off();
      if (lastActivityRef) lastActivityRef.off();

      branchesRef = db.ref(`history/${dateStr}/branches_map`);
      lastActivityRef = db.ref(`history/${dateStr}/last_activity`);

      lastActivityRef.on('value', snap => {
        lastActivityTimestamp = snap.val() || null;
        updateTimerAndState();
      });

      branchesRef.on('value', snap => {
        const data = snap.val();
        if (!data) {
          branchesRef.set(INITIAL_STATUSES);
          lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
        } else {
          branchStatus = data;
          renderGrid();
          renderPendingGrid();
        }
      });
    }

    bindFirebaseDateListeners(selectedDate);

    // ==========================================
    // ГРАФИК РАБОТЫ (КАЛЕНДАРЬ С ПАРОЛЕМ 16398)
    // ==========================================
    const CAL_PASS = "16398";
    let isCalAuthed = false;
    let calCurrentDate = new Date();
    let selectedCalDay = null;
    let calScheduleData = {};
    let calScheduleRef = null;

    const MONTH_NAMES = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

    function openScheduleModal() {
      document.body.classList.add('modal-open');
      document.getElementById('scheduleModalOverlay').classList.add('active');
      if (isCalAuthed) {
        showCalContent();
      }
    }

    function closeScheduleModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('scheduleModalOverlay').classList.remove('active');
    }

    function verifyCalPass() {
      const val = document.getElementById('calPassInput').value.trim();
      if (val === CAL_PASS) {
        isCalAuthed = true;
        showCalContent();
      } else {
        alert("Неверный пароль!");
        document.getElementById('calPassInput').value = '';
      }
    }

    function showCalContent() {
      document.getElementById('calAuthBlock').style.display = 'none';
      document.getElementById('calContentBlock').style.display = 'flex';
      initScheduleCalendar();
    }

    function changeCalMonth(delta) {
      calCurrentDate.setMonth(calCurrentDate.getMonth() + delta);
      initScheduleCalendar();
    }

    function getCalMonthKey() {
      const yyyy = calCurrentDate.getFullYear();
      const mm = String(calCurrentDate.getMonth() + 1).padStart(2, '0');
      return `${yyyy}-${mm}`;
    }

    function initScheduleCalendar() {
      const monthKey = getCalMonthKey();
      document.getElementById('calMonthTitle').textContent = `${MONTH_NAMES[calCurrentDate.getMonth()]} ${calCurrentDate.getFullYear()}`;

      if (calScheduleRef) calScheduleRef.off();
      calScheduleRef = db.ref(`schedules/${monthKey}`);

      calScheduleRef.on('value', snap => {
        calScheduleData = snap.val() || {};
        renderScheduleGrid();
      });
    }

    function renderScheduleGrid() {
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(d => {
        const h = document.createElement('div');
        h.className = 'cal-weekday';
        h.textContent = d;
        grid.appendChild(h);
      });

      const year = calCurrentDate.getFullYear();
      const month = calCurrentDate.getMonth();
      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDayIndex; i++) {
        const empty = document.createElement('div');
        empty.className = 'cal-day empty';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const cell = document.createElement('div');
        cell.className = 'cal-day';

        const shift = calScheduleData[`day_${day}`];
        if (shift === '98') cell.classList.add('st-98');
        if (shift === '163') cell.classList.add('st-163');
        if (shift === 'vh') cell.classList.add('st-vh');

        const numSpan = document.createElement('span');
        numSpan.className = 'cal-day-num';
        numSpan.textContent = day;

        const badgeSpan = document.createElement('span');
        badgeSpan.className = 'cal-day-badge';
        if (shift === '98') badgeSpan.textContent = '98';
        if (shift === '163') badgeSpan.textContent = '163';
        if (shift === 'vh') badgeSpan.textContent = 'ВХ';

        cell.appendChild(numSpan);
        cell.appendChild(badgeSpan);

        cell.onclick = () => openShiftModal(day);
        grid.appendChild(cell);
      }
    }

    function openShiftModal(day) {
      selectedCalDay = day;
      document.getElementById('shiftModalTitle').textContent = `${day} ${MONTH_NAMES[calCurrentDate.getMonth()]}`;
      document.getElementById('shiftModalOverlay').classList.add('active');
    }

    function closeShiftModal() {
      document.getElementById('shiftModalOverlay').classList.remove('active');
    }

    function setShift(type) {
      if (!selectedCalDay) return;
      const monthKey = getCalMonthKey();
      const ref = db.ref(`schedules/${monthKey}/day_${selectedCalDay}`);

      if (type === null) {
        ref.remove();
      } else {
        ref.set(type);
      }
      closeShiftModal();
    }

    // ==========================================
    // ЛОГИКА ОСП / ОСТАТОК / СБРОС
    // ==========================================
    function updateTimerAndState() {
      if (!lastActivityTimestamp) return;
      const elapsed = (Date.now() + serverTimeOffset) - lastActivityTimestamp;
      const remaining = TIMEOUT_MS - elapsed;

      if (remaining <= 0) {
        resetBtn.textContent = "Сбросить всё пароль (00) [00:00]";
      } else {
        const totalSecs = Math.floor(remaining / 1000);
        const mins = String(Math.floor(totalSecs / 60)).padStart(2, '0');
        const secs = String(totalSecs % 60).padStart(2, '0');
        resetBtn.textContent = `Сбросить всё пароль (00) [${mins}:${secs}]`;
      }
    }
    setInterval(updateTimerAndState, 1000);

    function renderGrid() {
      gridEl.innerHTML = '';
      let closedCount = 0;
      const filterValue = searchInput.value.trim();

      clearSearchBtn.style.display = filterValue ? 'block' : 'none';

      BRANCH_NUMBERS.forEach(num => {
        const numStr = num.toString();
        const isClosed = !!branchStatus[numStr];
        if (isClosed) closedCount++;

        if (filterValue !== '' && numStr !== filterValue) return;

        const card = document.createElement('div');
        card.className = `card ${isClosed ? 'is-closed' : ''}`;

        const name = document.createElement('span');
        name.className = 'branch-name';
        name.textContent = `Отделение №${numStr}`;

        const btn = document.createElement('button');
        btn.className = `status-btn ${isClosed ? 'active' : ''}`;
        btn.textContent = isClosed ? 'ЗАКРЫТО' : 'Не закрыто';
        btn.onclick = () => toggleBranch(numStr);

        card.appendChild(name);
        card.appendChild(btn);
        gridEl.appendChild(card);
      });

      counterEl.textContent = `${closedCount} / ${BRANCH_NUMBERS.length}`;
    }

    function toggleBranch(numStr) {
      const newStatus = !branchStatus[numStr];
      db.ref(`history/${selectedDate}/branches_map/${numStr}`).set(newStatus);
      lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
    }

    function renderPendingGrid() {
      const pendingGrid = document.getElementById('pendingGrid');
      pendingGrid.innerHTML = '';
      const pending = BRANCH_NUMBERS.filter(num => !branchStatus[num.toString()]);

      if (pending.length === 0) {
        pendingGrid.innerHTML = '<div class="pending-empty">🎉 Все отделения успешно закрыты!</div>';
        return;
      }

      pending.forEach(num => {
        const badge = document.createElement('div');
        badge.className = 'pending-badge';
        badge.textContent = `№${num}`;
        pendingGrid.appendChild(badge);
      });
    }

    function resetAll() {
      if (prompt('Введите пароль для сброса:') === '00') {
        const resetState = {};
        BRANCH_NUMBERS.forEach(num => resetState[num] = false);
        branchesRef.set(resetState);
        lastActivityRef.set(firebase.database.ServerValue.TIMESTAMP);
      }
    }

    // ==========================================
    // ЛОГИКА ЧАТА И СТИКЕРОВ
    // ==========================================
    function initStickers() {
      const grid = document.getElementById('stickerGrid');
      grid.innerHTML = '';
      TELEGRAM_STICKERS.forEach(url => {
        const item = document.createElement('div');
        item.className = 'sticker-item';
        const img = document.createElement('img');
        img.src = url;
        item.appendChild(img);
        item.onclick = () => sendSticker(url);
        grid.appendChild(item);
      });
    }
    initStickers();

    function toggleStickerPicker() {
      document.getElementById('stickerPicker').classList.toggle('active');
    }

    function sendSticker(url) {
      chatRef.push({ stickerUrl: url, isSticker: true, senderId: myUserId, color: myUserColor, timestamp: firebase.database.ServerValue.TIMESTAMP });
      document.getElementById('stickerPicker').classList.remove('active');
    }

    chatRef.limitToLast(50).on('value', snap => {
      const data = snap.val();
      const container = document.getElementById('chatMessages');
      container.innerHTML = '';
      if (data) {
        Object.values(data).forEach(msg => {
          const isMine = msg.senderId === myUserId;
          const msgDiv = document.createElement('div');
          msgDiv.className = `chat-message ${msg.isSticker ? 'is-sticker' : ''} ${isMine ? 'my-message' : ''}`;
          
          const meta = `<div class="message-meta"><span class="message-sender" style="color:${isMine ? '#93c5fd' : (msg.color||'#38bdf8')}">${isMine?'Вы':msg.senderId}</span></div>`;
          const content = msg.isSticker ? `<img class="tg-sticker-img" src="${msg.stickerUrl}">` : `<div class="message-text">${msg.text}</div>`;

          msgDiv.innerHTML = meta + content;
          container.appendChild(msgDiv);
        });
        if (isChatOpen) container.scrollTop = container.scrollHeight;
      }
    });

    function sendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (!val) return;
      chatRef.push({ text: val, senderId: myUserId, color: myUserColor, timestamp: firebase.database.ServerValue.TIMESTAMP });
      input.value = '';
    }

    function openChat() {
      isChatOpen = true;
      document.body.classList.add('modal-open');
      document.getElementById('chatModalOverlay').classList.add('active');
    }

    function closeChat() {
      isChatOpen = false;
      document.body.classList.remove('modal-open');
      document.getElementById('chatModalOverlay').classList.remove('active');
    }

    function openPendingModal() {
      document.body.classList.add('modal-open');
      document.getElementById('pendingModalOverlay').classList.add('active');
    }

    function closePendingModal() {
      document.body.classList.remove('modal-open');
      document.getElementById('pendingModalOverlay').classList.remove('active');
    }

    function handleOverlayClick(e, type) {
      if (type === 'chat' && e.target === document.getElementById('chatModalOverlay')) closeChat();
      if (type === 'pending' && e.target === document.getElementById('pendingModalOverlay')) closePendingModal();
      if (type === 'schedule' && e.target === document.getElementById('scheduleModalOverlay')) closeScheduleModal();
      if (type === 'shift' && e.target === document.getElementById('shiftModalOverlay')) closeShiftModal();
    }

    searchInput.addEventListener('input', renderGrid);
    function clearSearch() { searchInput.value = ''; renderGrid(); }
  </script>
</body>
</html>
